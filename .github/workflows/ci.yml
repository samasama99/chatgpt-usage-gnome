name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install development dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Audit development dependency tree
        run: npm audit --audit-level=high

      - name: Typecheck, build, test, and scan
        run: npm run check
